<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="theme-color"
      content="#fff7ed"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#120f17"
      media="(prefers-color-scheme: dark)"
    />
    <title>Offline · Pill happens</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fff7ed;
        --foreground: #2a1914;
        --muted: #755447;
        --surface: #fffaf2;
        --edge: #d9cbbd;
        --glow: #fed7aa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: #120f17;
          --foreground: #fed7aa;
          --muted: #bda084;
          --surface: #211b1b;
          --edge: #50423a;
          --glow: #9a3412;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(
          ellipse at 50% 20%,
          color-mix(in srgb, var(--glow) 35%, var(--background)),
          var(--background) 70%
        );
        color: var(--foreground);
        font:
          15px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
      }
      .brand {
        margin: 0 0 28px;
        font-size: 12px;
        font-weight: 550;
        text-align: center;
      }
      section {
        padding: 28px;
        border: 1px solid var(--edge);
        border-radius: 24px;
        background: var(--surface);
        text-align: center;
        box-shadow: 0 12px 40px #120f1705;
      }
      .symbol {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: color-mix(in srgb, var(--foreground) 5%, transparent);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 48px;
        margin-top: 24px;
        padding: 12px 20px;
        border-radius: 14px;
        background: #fed7aa;
        color: #120f17;
        text-decoration: none;
        font-weight: 550;
      }
      a:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 4px;
      }
      .note {
        margin-top: 18px;
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">pill happens</div>
      <section aria-labelledby="offline-heading">
        <div class="symbol" aria-hidden="true">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M3 3 21 21M8 8a12 12 0 0 1 12 3M4 11a12 12 0 0 1 1.5-1M7 15a7 7 0 0 1 7-.8M10.5 19a2 2 0 0 1 3 0"
            />
          </svg>
        </div>
        <h1 id="offline-heading">A moment offline</h1>
        <p>Reconnect to open your journal and save an intake.</p>
        <a href="/">Try again <span aria-hidden="true">↗</span></a>
      </section>
      <p class="note">Nothing is recorded while you’re offline.</p>
    </main>
  </body>
</html>
