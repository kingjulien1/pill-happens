<!doctype html>
<html lang="en">

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="theme-color"
      content="#f1e5f4"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#29213b"
      media="(prefers-color-scheme: dark)"
    />
    <title>Offline · Pill happens</title>
    <style>

            transparent 90%
          ),
          radial-gradient(
            ellipse 54% 62% at 80% 39%,
            oklch(70.2% 0.183 293.541) 14%,
            transparent 88%
          ),
          radial-gradient(
            ellipse 78% 51% at 71% 96%,
            oklch(83.3% 0.145 321.434) 8%,
            transparent 89%
          ),
          oklch(70.2% 0.183 293.541);
        --app-canvas-accent-opacity: 0.07;

        --app-canvas-base: #f1e5f4;
        --app-canvas-background:
          radial-gradient(ellipse at 10% 5%, #f5cee6, transparent 57%),
          radial-gradient(ellipse at 95% 15%, #ddcef6, transparent 58%),
          radial-gradient(ellipse at 48% 100%, #e5ddf8, transparent 62%),

        --muted-foreground: #604668;
        --primary: #9d174d;
        --primary-foreground: #ffffff;

            oklch(83.3% 0.145 321.434) 10%,

            #332047 82%,

          linear-gradient(oklch(82.3% 0.12 346.018 / 0.21) 0 0);

        --app-iridescence-blur: 4px;
        --app-canvas-foreground: #ffffff;
        --app-canvas-muted-foreground: #ded8ec;
        --background: #2b233e;
        --foreground: #ffffff;
        --card: #352a45;
        --muted-foreground: #e1d9f4;
        --primary: #bca4e4;
        --primary-foreground: #111014;
        --border: #bca4e445;
        --ring: #bca4e4;
        --shadow: #1110146b;
        --glow: #bfa4e352;
      }
      /* END GENERATED APP THEME */
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--app-canvas-base);
      }
      body {
        isolation: isolate;
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        background: var(--app-canvas-background);
        color: var(--app-canvas-foreground);
        font:
          15px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: var(--app-canvas-accent);
        opacity: var(--app-canvas-accent-opacity);
        pointer-events: none;
      }
      main {
        width: 100%;
        max-width: 360px;
      }
      .brand {
        margin: 0 0 28px;
        font-size: 12px;
        font-weight: 550;
        text-align: center;
      }
      section {
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--card);
        color: var(--foreground);
        text-align: center;
        box-shadow: 0 12px 40px var(--shadow);
      }
      .symbol {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: color-mix(in srgb, var(--foreground) 5%, transparent);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      p {
        margin: 10px 0 0;
        color: var(--muted-foreground);
        font-size: 13px;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 48px;
        margin-top: 24px;
        padding: 12px 20px;
        border-radius: 14px;
        background: var(--primary);
        color: var(--primary-foreground);
        text-decoration: none;
        font-weight: 550;
      }
      a:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 4px;
      }
      .note {
        margin-top: 18px;
        color: var(--app-canvas-muted-foreground);
        font-size: 11px;
        text-align: center;
      }
    </style>

  </head>
  <body>
    <main>
      <div class="brand">pill happens</div>
      <section aria-labelledby="offline-heading">
        <div class="symbol" aria-hidden="true">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M3 3 21 21M8 8a12 12 0 0 1 12 3M4 11a12 12 0 0 1 1.5-1M7 15a7 7 0 0 1 7-.8M10.5 19a2 2 0 0 1 3 0"

</html>
